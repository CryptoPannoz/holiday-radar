name: Refresh holiday data

# Le date delle vacanze scolastiche escono a scaglioni durante l'anno: una
# rigenerazione mensile le raccoglie senza tempestare le API gratuite.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild data from upstream APIs
        run: npm run build:data

      - name: Sanity-check the result
        run: npm run check

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nessuna variazione: niente commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh holidays from upstream sources"
          git push
